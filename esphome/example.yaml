# Tigo RS485 Monitor - ESPHome example
#
# Reference configuration: the README explains each part step by step.
# Wiring: RS-485 transceiver in receive-only mode (RE/DE to GND), A/B in parallel
# with the TAP <-> CCA bus, RO/TXD -> rx_pin. The ESP32 never transmits on the bus.

esphome:
  name: tigo-rs485
  friendly_name: Tigo RS485

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Web dashboard at http://tigo-rs485.local/ (standard ESPHome page at /?esphome)
web_server:
  port: 80

external_components:
  # ESPHome finds the esphome/components folder of the repository by itself
  - source: github://Bobsilvio/tigo_server@main
    components: [tigo_rs485]

uart:
  id: tigo_bus
  rx_pin: GPIO16
  baud_rate: 38400
  rx_buffer_size: 2048

tigo_rs485:
  uart_id: tigo_bus
  # Automatic slots: each optimizer takes the first free one as soon as its long
  # address is known. Entities: "Panel 1 Power", ..., "Panel 1 Address".
  panels: 12
  # Optional:
  # panel_name: "Panel {}"
  # panel_sensors: [power, voltage_in, voltage_out, current, temperature, rssi, duty_cycle]
  # offline_timeout: 5min
  # web_dashboard: true

text_sensor:
  # Optimizers reporting without a slot or a long_address entry
  - platform: tigo_rs485
    unconfigured_panels:
      name: Unconfigured panels

sensor:
  # Optional: a panel with fixed names, declared by its long address.
  # It does not take an automatic slot.
  - platform: tigo_rs485
    long_address: "04C05B4000B1A688"
    power:
      name: Roof A1 Power
      id: a1_power
    voltage_in:
      name: Roof A1 Voltage In
    temperature:
      name: Roof A1 Temperature

  # Energy of that panel, integrated on the device (for the Energy dashboard)
  - platform: integration
    name: Roof A1 Energy
    sensor: a1_power
    time_unit: h
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    restore: true

  # Fallback when the long address is not known yet: the short node ID assigned
  # by the CCA (it can change after a rediscovery).
  # - platform: tigo_rs485
  #   node_id: 0x001C
  #   power:
  #     name: A3 Power
