name: "Tigo RS485 Monitor"
version: "1.0.0"
slug: tigo_rs485_monitor
description: >-
  Dashboard of the Tigo RS485 Monitor (ESPHome) in the Home Assistant sidebar:
  live panels, analysis and months of energy history per panel.
url: https://github.com/Bobsilvio/tigo_server
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
# Sidebar panel served through Home Assistant ingress: works remotely and in the app,
# no port is exposed on the network.
ingress: true
ingress_port: 8099
panel_icon: "mdi:solar-panel-large"
panel_title: "Tigo"
options:
  host: ""
  port: 80
  username: ""
  password: ""
  retention_days: 730
schema:
  host: str
  port: port
  username: "str?"
  password: "password?"
  retention_days: "int(30,3650)"
